; simOpenGL3 renderer configuration.
;
; Read once, when the plugin is loaded, from CoppeliaSim's resources directory
; (the "paths.resources" app property, which is normally the application
; folder itself).
; Every value below is the built-in default, so deleting the file changes
; nothing. A missing file, an invalid value and an unknown key are all reported
; as warnings in the console: each one means the file you think is in effect is
; not.

[antiAliasing]
; 1 disables multisampling, otherwise clamped to GL_MAX_SAMPLES
samples=4

[shadows]
enabled=true
; per light, square, in texels
mapSize=1024
; hard cap of the shadow texture array (directional light = 1 layer, spot = 1,
; point light = 6)
maxLayers=64
polygonOffset=true
; spacing of the 3x3 PCF taps, in shadow map texels
pcfRadius=1

[shading]
; decode surface colours and textures from sRGB and encode the finished image,
; lighting in linear space. Light colours and the scene ambient are used as
; authored, exactly like CoppeliaSim's own renderer, so turning this on does not
; darken the scene.
gammaCorrect=true
; none, reinhard or aces
toneMapping=none
exposure=1.0
fog=true

[geometry]
cullBackFaces=true
depthPrepass=false
frustumCulling=true


